import React, { useState, useEffect, useRef, useCallback } from 'react';
import { 
    Upload, FileText, File, Video, Camera, Image as ImageIcon, 
    PenTool, Save, Trash2, ChevronRight, AlertCircle, CheckCircle2, 
    Clapperboard, PenLine, Undo
} from 'lucide-react';

// ==========================================
// 1. DYNAMIC SCRIPT LOADER FOR EXTERNAL LIBRARIES
// ==========================================
const loadScript = (src) => {
    return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) {
            resolve();
            return;
        }
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
    });
};

const CDNS = {
    localforage: 'https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js',
    pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    pdfjsWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
    mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'
};

const STORAGE_KEY = 'cine_set_tracker_v2';

export default function SetTrackerApp() {
    // ==========================================
    // 2. APP STATE MANAGEMENT
    // ==========================================
    const [appStatus, setAppStatus] = useState('loading_deps'); // loading_deps, import, workspace
    const [toast, setToast] = useState({ show: false, msg: '', type: 'info' });
    
    // Core Data
    const [callSheetText, setCallSheetText] = useState('');
    const [scriptText, setScriptText] = useState('');
    const [parsedScenes, setParsedScenes] = useState([]); // [{id: '1-1', raw: '1-1', index: 0}, ...]
    const [scriptChunks, setScriptChunks] = useState({}); // {'1-1': "text content..."}
    
    // Active UI State
    const [activeSceneId, setActiveSceneId] = useState(null);
    const [workstationData, setWorkstationData] = useState({}); // { '1-1': { camera: 'ARRI', lens: '35mm', notes: '', canvas: 'data:image...' } }

    // ==========================================
    // 3. INITIALIZATION & STORAGE
    // ==========================================
    useEffect(() => {
        const initApp = async () => {
            try {
                // Load Dependencies sequentially to avoid race conditions
                await loadScript(CDNS.localforage);
                await loadScript(CDNS.pdfjs);
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = CDNS.pdfjsWorker;
                await loadScript(CDNS.mammoth);

                // Initialize localforage
                window.localforage.config({
                    name: 'SetTrackerDB',
                    storeName: 'workstation_store'
                });

                // Load existing data if available
                const savedData = await window.localforage.getItem(STORAGE_KEY);
                if (savedData && savedData.parsedScenes && savedData.parsedScenes.length > 0) {
                    setCallSheetText(savedData.callSheetText || '');
                    setScriptText(savedData.scriptText || '');
                    setParsedScenes(savedData.parsedScenes || []);
                    setScriptChunks(savedData.scriptChunks || {});
                    setWorkstationData(savedData.workstationData || {});
                    setActiveSceneId(savedData.activeSceneId || savedData.parsedScenes[0]?.id || null);
                    setAppStatus('workspace');
                } else {
                    setAppStatus('import');
                }
            } catch (err) {
                showToast('依赖加载失败，请检查网络后再试。', 'error');
            }
        };
        initApp();
    }, []);

    // Auto-save data when specific states change
    useEffect(() => {
        if (appStatus === 'workspace') {
            const dataToSave = {
                callSheetText,
                scriptText,
                parsedScenes,
                scriptChunks,
                workstationData,
                activeSceneId
            };
            window.localforage.setItem(STORAGE_KEY, dataToSave).catch(e => console.error("Save failed", e));
        }
    }, [callSheetText, scriptText, parsedScenes, scriptChunks, workstationData, activeSceneId, appStatus]);

    const showToast = (msg, type = 'info') => {
        setToast({ show: true, msg, type });
        setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 3000);
    };

    // ==========================================
    // 4. PARSER ENGINE (REGEX & TEXT EXTRACTION)
    // ==========================================
    const extractTextFromPdf = async (file) => {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument(arrayBuffer).promise;
        let text = "";
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(item => item.str).join(" ") + "\n";
        }
        return text;
    };

    const extractTextFromDocx = async (file) => {
        const arrayBuffer = await file.arrayBuffer();
        const result = await window.mammoth.extractRawText({ arrayBuffer });
        return result.value;
    };

    const parseSceneIds = (text) => {
        // Regex to match scene formats: 1-1, 12-3A, 第1场, 场次2
        // 增强版正则表达式，能抓取 1-1, 1-1A, 第1场, 场次1 等多种格式
const regex = /(?:第\s*(\d+)\s*场|场次\s*(\d+(?:-\d+[A-Za-z]?)?)|场\s*(\d+(?:-\d+[A-Za-z]?)?)|\b(\d+-\d+[A-Za-z]?)\b)/g;
        const matches = [...text.matchAll(regex)];
        const scenes = [];
        const uniqueIds = new Set();

        matches.forEach(match => {
            const id = match[1] || match[2] || match[3] || match[4];
            if (id && !uniqueIds.has(id)) {
                uniqueIds.add(id);
                scenes.push({ id, raw: match[0], index: match.index });
            }
        });
        return scenes;
    };

    const chunkScriptByScenes = (scriptTxt, extractedScenes) => {
        const chunks = {};
        if (!scriptTxt || extractedScenes.length === 0) return chunks;

        // Try to find the position of each scene in the script text
        const positions = [];
        extractedScenes.forEach(scene => {
            // Create a dynamic regex to find this specific scene in script
            const escapedRaw = scene.raw.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            // Try matching the exact phrase or just the ID
            const searchRegex = new RegExp(`(?:${escapedRaw}|第\\s*${scene.id}\\s*场|场次\\s*${scene.id}|${scene.id})`, 'i');
            const match = scriptTxt.match(searchRegex);
            if (match) {
                positions.push({ id: scene.id, index: match.index });
            }
        });

        positions.sort((a, b) => a.index - b.index);

        for (let i = 0; i < positions.length; i++) {
            const curr = positions[i];
            const next = positions[i + 1];
            const startIdx = curr.index;
            const endIdx = next ? next.index : scriptTxt.length;
            chunks[curr.id] = scriptTxt.substring(startIdx, endIdx).trim();
        }
        return chunks;
    };

    // ==========================================
    // 5. IMPORT HANDLERS
    // ==========================================
    const handleProcessFiles = async (callSheetFile, scriptFile) => {
        try {
            if (!callSheetFile) {
                showToast("请至少上传通告单！", "error");
                return;
            }

            setAppStatus('loading_deps');
            
            // 1. Extract Call Sheet Text
            let csText = "";
            if (callSheetFile.type === 'application/pdf') {
                csText = await extractTextFromPdf(callSheetFile);
            } else {
                csText = await callSheetFile.text(); // Fallback for txt
            }

            // 2. Extract Script Text (Optional)
            let spText = "";
            if (scriptFile) {
                if (scriptFile.type === 'application/pdf') {
                    spText = await extractTextFromPdf(scriptFile);
                } else if (scriptFile.name.endsWith('.docx')) {
                    spText = await extractTextFromDocx(scriptFile);
                } else {
                    spText = await scriptFile.text(); // Fallback txt
                }
            }

            // 3. Parse and Match
            const scenes = parseSceneIds(csText);
            if (scenes.length === 0) {
                showToast("未能从通告单中识别到标准场次号(如1-1, 第1场)。提取可能不完整。", "error");
                // Create a dummy scene to allow app to open
                scenes.push({ id: 'Uncategorized', raw: '未识别分类', index: 0 });
            }

            const chunks = chunkScriptByScenes(spText, scenes);

            setCallSheetText(csText);
            setScriptText(spText);
            setParsedScenes(scenes);
            setScriptChunks(chunks);
            setActiveSceneId(scenes[0].id);
            
            showToast("解析成功！已自动匹配场次与剧本。");
            setAppStatus('workspace');

        } catch (error) {
            console.error(error);
            showToast("文件解析失败，请检查格式是否为标准 PDF/DOCX。", "error");
            setAppStatus('import');
        }
    };

    const clearData = async () => {
        await window.localforage.removeItem(STORAGE_KEY);
        setCallSheetText('');
        setScriptText('');
        setParsedScenes([]);
        setScriptChunks({});
        setWorkstationData({});
        setActiveSceneId(null);
        setAppStatus('import');
    };

    // ==========================================
    // 6. UI RENDERERS
    // ==========================================

    if (appStatus === 'loading_deps') {
        return (
            <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center text-slate-300">
                <Clapperboard className="w-16 h-16 animate-bounce text-amber-500 mb-4" />
                <h2 className="text-xl font-bold">正在初始化片场工作台...</h2>
                <p className="text-slate-500 mt-2 text-sm">加载解析引擎与本地数据库</p>
            </div>
        );
    }

    if (appStatus === 'import') {
        return (
            <ImportScreen 
                onProcess={handleProcessFiles} 
                toast={toast} 
            />
        );
    }

    return (
        <div className="h-screen w-screen overflow-hidden bg-slate-950 text-slate-200 flex flex-col font-sans selection:bg-amber-500/30">
            {/* TOP NAVIGATION BAR */}
            <header className="h-14 shrink-0 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4">
                <div className="flex items-center space-x-3">
                    <div className="bg-gradient-to-br from-amber-500 to-orange-600 p-1.5 rounded-lg">
                        <Clapperboard className="w-5 h-5 text-slate-950" />
                    </div>
                    <h1 className="font-bold text-slate-100 hidden sm:block">片场工作台 <span className="text-slate-500 font-normal text-sm ml-2">离线存储已启用</span></h1>
                </div>
                <div className="flex items-center space-x-3">
                    <button onClick={clearData} className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-rose-400 hover:bg-slate-700 transition-colors flex items-center">
                        <Trash2 className="w-4 h-4 mr-1.5" /> 重新导入
                    </button>
                </div>
            </header>

            {/* MAIN 3-COLUMN WORKSPACE */}
            <main className="flex-1 flex overflow-hidden h-[calc(100vh-3.5rem)] relative">
                
                {/* Column 1: Call Sheet Index */}
                <section className="w-64 lg:w-72 flex-none bg-slate-900 border-r border-slate-800 flex flex-col">
                    <div className="p-3 border-b border-slate-800 bg-slate-900 z-10 shadow-sm">
                        <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center">
                            <FileText className="w-4 h-4 mr-1.5" /> 通告场次列表
                        </h2>
                        <div className="text-[11px] text-slate-500 leading-tight">从通告单自动提取，点击查看剧本与机位笔记</div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar">
                        {parsedScenes.map((scene, idx) => (
                            <button
                                key={`${scene.id}-${idx}`}
                                onClick={() => setActiveSceneId(scene.id)}
                                className={`w-full text-left px-3 py-3 rounded-xl transition-all flex items-center justify-between ${
                                    activeSceneId === scene.id 
                                    ? 'bg-amber-500/10 border border-amber-500/50 text-amber-400' 
                                    : 'bg-slate-800/40 border border-transparent text-slate-300 hover:bg-slate-800'
                                }`}
                            >
                                <span className="font-mono font-bold text-sm">场 {scene.id}</span>
                                {activeSceneId === scene.id && <ChevronRight className="w-4 h-4" />}
                            </button>
                        ))}
                    </div>
                </section>

                {/* Column 2: Script Viewer */}
                <section className="flex-1 bg-slate-950 flex flex-col border-r border-slate-800 overflow-hidden relative">
                    <div className="p-3 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between backdrop-blur-md">
                        <h2 className="text-sm font-bold text-cyan-400 flex items-center">
                            <File className="w-4 h-4 mr-1.5" /> 当前场次对应剧本
                        </h2>
                        <span className="text-xs font-mono bg-slate-800 px-2 py-1 rounded-md text-slate-300">SCENE {activeSceneId}</span>
                    </div>
                    <div className="flex-1 overflow-y-auto p-6 md:p-8 custom-scrollbar">
                        {scriptChunks[activeSceneId] ? (
                            <div className="prose prose-invert prose-slate max-w-none text-base md:text-lg leading-relaxed text-slate-200 whitespace-pre-wrap font-sans">
                                {scriptChunks[activeSceneId]}
                            </div>
                        ) : (
                            <div className="h-full flex flex-col items-center justify-center text-slate-500 space-y-3">
                                <AlertCircle className="w-12 h-12 text-slate-700" />
                                <p>未在导入的剧本中精确匹配到场次 {activeSceneId} 的文本</p>
                                <p className="text-xs">该场次可能是飞页或编号格式不一致</p>
                            </div>
                        )}
                    </div>
                </section>

                {/* Column 3: Workstation (Camera, Notes, Canvas) */}
                <Workstation 
                    activeSceneId={activeSceneId}
                    workstationData={workstationData}
                    setWorkstationData={setWorkstationData}
                    showToast={showToast}
                />

            </main>

            {/* TOAST */}
            {toast.show && (
                <div className={`fixed bottom-6 right-6 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2 text-sm font-medium transform transition-all z-50 animate-in slide-in-from-bottom-5 ${
                    toast.type === 'error' ? 'bg-rose-500 text-white' : 'bg-slate-800 border border-amber-500/50 text-amber-50'
                }`}>
                    {toast.type === 'error' ? <AlertCircle className="w-4 h-4" /> : <CheckCircle2 className="w-4 h-4 text-emerald-400" />}
                    <span>{toast.msg}</span>
                </div>
            )}

            {/* Custom Scrollbar Styles appended globally */}
            <style dangerouslySetInnerHTML={{__html: `
                .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
                .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
                .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
                .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
            `}} />
        </div>
    );
}

// ==========================================
// COMPONENT: IMPORT SCREEN
// ==========================================
function ImportScreen({ onProcess, toast }) {
    const [callSheet, setCallSheet] = useState(null);
    const [script, setScript] = useState(null);
    const [isProcessing, setIsProcessing] = useState(false);

    const handleStart = async () => {
        setIsProcessing(true);
        await onProcess(callSheet, script);
        setIsProcessing(false); // Reset if it failed and didn't unmount
    };

    return (
        <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-2xl w-full shadow-2xl space-y-8">
                
                <div className="text-center space-y-2">
                    <div className="inline-flex bg-amber-500/10 p-3 rounded-2xl mb-2 border border-amber-500/20">
                        <Clapperboard className="w-10 h-10 text-amber-500" />
                    </div>
                    <h1 className="text-2xl font-bold text-slate-100">片场工作台配置</h1>
                    <p className="text-slate-400 text-sm">导入通告单和剧本文件，应用将离线自动匹配场次联动</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {/* Call Sheet Input */}
                    <div className={`border-2 border-dashed rounded-2xl p-6 text-center transition-colors relative ${callSheet ? 'border-emerald-500/50 bg-emerald-500/5' : 'border-slate-700 bg-slate-800/50 hover:bg-slate-800'}`}>
                        <input 
                            type="file" accept=".pdf,.txt"
                            onChange={e => setCallSheet(e.target.files[0])}
                            className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                        />
                        <FileText className={`w-8 h-8 mx-auto mb-3 ${callSheet ? 'text-emerald-400' : 'text-slate-500'}`} />
                        <h3 className="text-sm font-bold text-slate-200 mb-1">
                            {callSheet ? callSheet.name : '导入通告单 (必须)'}
                        </h3>
                        <p className="text-xs text-slate-500">支持 PDF 格式。将通过解析提取拍摄场次。</p>
                        {callSheet && <CheckCircle2 className="absolute top-3 right-3 w-5 h-5 text-emerald-500" />}
                    </div>

                    {/* Script Input */}
                    <div className={`border-2 border-dashed rounded-2xl p-6 text-center transition-colors relative ${script ? 'border-cyan-500/50 bg-cyan-500/5' : 'border-slate-700 bg-slate-800/50 hover:bg-slate-800'}`}>
                        <input 
                            type="file" accept=".pdf,.docx,.txt"
                            onChange={e => setScript(e.target.files[0])}
                            className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                        />
                        <File className={`w-8 h-8 mx-auto mb-3 ${script ? 'text-cyan-400' : 'text-slate-500'}`} />
                        <h3 className="text-sm font-bold text-slate-200 mb-1">
                            {script ? script.name : '导入剧本 (可选)'}
                        </h3>
                        <p className="text-xs text-slate-500">支持 PDF / DOCX。用于匹配场次内容。</p>
                        {script && <CheckCircle2 className="absolute top-3 right-3 w-5 h-5 text-cyan-500" />}
                    </div>
                </div>

                <div className="flex flex-col items-center pt-4">
                    <button 
                        onClick={handleStart}
                        disabled={!callSheet || isProcessing}
                        className="w-full md:w-auto px-8 py-3.5 rounded-xl font-bold text-sm bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition-opacity flex items-center justify-center shadow-lg shadow-amber-500/20"
                    >
                        {isProcessing ? (
                            <><Clapperboard className="w-5 h-5 mr-2 animate-spin" /> 解析与加载中...</>
                        ) : (
                            <><Upload className="w-5 h-5 mr-2" /> 开始构建工作台</>
                        )}
                    </button>
                    {toast.show && toast.type === 'error' && (
                        <p className="text-rose-400 text-xs mt-3 flex items-center"><AlertCircle className="w-3 h-3 mr-1"/> {toast.msg}</p>
                    )}
                </div>
            </div>
        </div>
    );
}

// ==========================================
// COMPONENT: WORKSTATION (Right Column)
// ==========================================
function Workstation({ activeSceneId, workstationData, setWorkstationData, showToast }) {
    
    // Scene Specific State
    const activeData = workstationData[activeSceneId] || { camera: 'ARRI Alexa Mini LF', lens: '', notes: '', canvas: null };

    const updateActiveData = (field, value) => {
        if (!activeSceneId) return;
        setWorkstationData(prev => ({
            ...prev,
            [activeSceneId]: {
                ...(prev[activeSceneId] || { camera: 'ARRI Alexa Mini LF', lens: '', notes: '', canvas: null }),
                [field]: value
            }
        }));
    };

    // Canvas Drawing Logic
    const canvasRef = useRef(null);
    const containerRef = useRef(null);
    const [isDrawing, setIsDrawing] = useState(false);
    
    // Resize & Load Canvas state on scene change
    useEffect(() => {
        const canvas = canvasRef.current;
        const container = containerRef.current;
        if (!canvas || !container || !activeSceneId) return;

        // Set internal resolution strictly matching CSS size for crisp Apple Pencil drawing
        const rect = container.getBoundingClientRect();
        // Avoid resetting if size is same, to prevent flicker, but must reset on scene change
        canvas.width = rect.width;
        canvas.height = 200; // Fixed height for drawing area

        const ctx = canvas.getContext('2d');
        
        // Fill base dark background
        ctx.fillStyle = '#1e293b'; // slate-800
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw 9:16 safe frame guide
        const cw = canvas.width;
        const ch = canvas.height;
        const vw = Math.round(ch * (9 / 16));
        const vx = Math.round((cw - vw) / 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(vx, 10, vw, ch - 20);
        ctx.setLineDash([]); // reset

        // Load saved drawing if exists
        if (activeData.canvas) {
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0);
            };
            img.src = activeData.canvas;
        }
    }, [activeSceneId]); // Reload when scene changes

    // Pointer Events for Drawing
    const getPos = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
    };

    const handlePointerDown = (e) => {
        setIsDrawing(true);
        const ctx = canvasRef.current.getContext('2d');
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        // Important for iPad: Capture pointer to prevent scrolling while drawing
        e.target.setPointerCapture(e.pointerId);
    };

    const handlePointerMove = (e) => {
        if (!isDrawing) return;
        const ctx = canvasRef.current.getContext('2d');
        const pos = getPos(e);
        ctx.strokeStyle = '#f59e0b'; // amber-500 for ink
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    };

    const handlePointerUp = (e) => {
        if (!isDrawing) return;
        setIsDrawing(false);
        e.target.releasePointerCapture(e.pointerId);
        
        // Save canvas to state (debounced natively by user lifting pen)
        const dataUrl = canvasRef.current.toDataURL('image/png');
        updateActiveData('canvas', dataUrl);
    };

    const clearCanvas = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Redraw guides
        const cw = canvas.width;
        const ch = canvas.height;
        const vw = Math.round(ch * (9 / 16));
        const vx = Math.round((cw - vw) / 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(vx, 10, vw, ch - 20);
        ctx.setLineDash([]);

        updateActiveData('canvas', null);
        showToast("画板已清空");
    };

    if (!activeSceneId) {
        return (
            <section className="w-80 lg:w-96 bg-slate-900 border-l border-slate-800 flex items-center justify-center text-slate-500">
                请先在左侧选择场次
            </section>
        );
    }

    return (
        <section className="w-80 xl:w-96 flex-none bg-slate-900 border-l border-slate-800 flex flex-col">
            
            {/* Header */}
            <div className="p-3 border-b border-slate-800 bg-slate-900 z-10 shadow-sm flex items-center justify-between">
                <h2 className="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center">
                    <Video className="w-4 h-4 mr-1.5" /> 摄影机/导演工作区
                </h2>
                <span className="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-400 border border-slate-700">离线保存</span>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-5 custom-scrollbar">
                
                {/* 1. Camera & Lens Dropdowns */}
                <div className="space-y-3 bg-slate-800/40 p-3 rounded-xl border border-slate-700/50">
                    <div>
                        <label className="text-xs font-bold text-slate-400 mb-1.5 flex items-center"><Camera className="w-3 h-3 mr-1"/> 摄影机机型</label>
                        <select 
                            value={activeData.camera}
                            onChange={(e) => updateActiveData('camera', e.target.value)}
                            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 appearance-none"
                        >
                            <option value="ARRI Alexa Mini LF">ARRI Alexa Mini LF</option>
                            <option value="ARRI Alexa 35">ARRI Alexa 35</option>
                            <option value="Sony FX6">Sony FX6</option>
                            <option value="Sony Venice 2">Sony Venice 2</option>
                            <option value="DJI Ronin 4D">DJI Ronin 4D</option>
                            <option value="RED V-Raptor">RED V-Raptor</option>
                        </select>
                    </div>

                    <div>
                        <label className="text-xs font-bold text-slate-400 mb-1.5 flex items-center"><ImageIcon className="w-3 h-3 mr-1"/> 镜头选择</label>
                        <select 
                            value={activeData.lens}
                            onChange={(e) => updateActiveData('lens', e.target.value)}
                            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-amber-400 font-mono focus:outline-none focus:border-amber-500 appearance-none"
                        >
                            <option value="">未指定镜头</option>
                            <optgroup label="NiSi Athena Prime">
                                <option value="NiSi 14mm T2.4">NiSi 14mm T2.4</option>
                                <option value="NiSi 25mm T1.9">NiSi 25mm T1.9</option>
                                <option value="NiSi 35mm T1.9">NiSi 35mm T1.9</option>
                                <option value="NiSi 50mm T1.9">NiSi 50mm T1.9</option>
                                <option value="NiSi 85mm T1.9">NiSi 85mm T1.9</option>
                            </optgroup>
                            <optgroup label="Thypoch Simera-C">
                                <option value="Simera-C 21mm T1.5">Simera-C 21mm T1.5</option>
                                <option value="Simera-C 28mm T1.5">Simera-C 28mm T1.5</option>
                                <option value="Simera-C 35mm T1.5">Simera-C 35mm T1.5</option>
                                <option value="Simera-C 50mm T1.5">Simera-C 50mm T1.5</option>
                                <option value="Simera-C 75mm T1.5">Simera-C 75mm T1.5</option>
                            </optgroup>
                            <optgroup label="ARRI Signature Prime">
                                <option value="ARRI SP 18mm T1.8">ARRI SP 18mm T1.8</option>
                                <option value="ARRI SP 35mm T1.8">ARRI SP 35mm T1.8</option>
                                <option value="ARRI SP 47mm T1.8">ARRI SP 47mm T1.8</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                {/* 2. Drawing Canvas (Apple Pencil Ready) */}
                <div className="space-y-2">
                    <div className="flex items-center justify-between">
                        <label className="text-xs font-bold text-slate-400 flex items-center"><PenTool className="w-3 h-3 mr-1"/> 分镜/机位画板</label>
                        <button onClick={clearCanvas} className="text-[10px] text-slate-500 hover:text-rose-400 flex items-center transition-colors">
                            <Undo className="w-3 h-3 mr-1" /> 清空
                        </button>
                    </div>
                    <div 
                        ref={containerRef} 
                        className="w-full h-[200px] rounded-xl overflow-hidden border border-slate-700 bg-slate-800 relative shadow-inner"
                    >
                        <canvas 
                            ref={canvasRef}
                            onPointerDown={handlePointerDown}
                            onPointerMove={handlePointerMove}
                            onPointerUp={handlePointerUp}
                            onPointerOut={handlePointerUp}
                            style={{ touchAction: 'none' }} // Prevents iPad scrolling while drawing
                            className="absolute inset-0 cursor-crosshair w-full h-full"
                        />
                        <div className="absolute bottom-1.5 right-2 text-[9px] text-slate-600 pointer-events-none font-mono">
                            支持 Apple Pencil
                        </div>
                    </div>
                </div>

                {/* 3. Notes Textarea */}
                <div className="space-y-2 flex-1 flex flex-col">
                    <label className="text-xs font-bold text-slate-400 flex items-center"><PenLine className="w-3 h-3 mr-1"/> 现场场记与摄影笔记</label>
                    <textarea 
                        value={activeData.notes}
                        onChange={(e) => updateActiveData('notes', e.target.value)}
                        placeholder="输入光比要求、走位变化、灯具选型、台词飞页..."
                        className="w-full flex-1 min-h-[120px] bg-slate-800/40 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 leading-relaxed focus:outline-none focus:border-amber-500 resize-none transition-colors"
                    />
                </div>
            </div>
        </section>
    );
}


        // ========================================== //
        // ⬆️ 粘贴区域结束 ⬆️
        // ========================================== //

        // 👇 关键点 2：千万不要删掉下面这两行，这是启动 App 的开关 👇
        const root = createRoot(document.getElementById('root'));
        root.render(<SetTrackerApp />);
    </script>
</body>
</html>
